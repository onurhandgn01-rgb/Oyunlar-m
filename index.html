<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Operasyon: Son Dalga</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101820;color:white;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:fixed;top:12px;left:0;width:100%;display:flex;justify-content:space-around;pointer-events:none;font-weight:bold}
.stat{background:#172a35dd;padding:10px;border-radius:10px}
#startScreen{position:fixed;inset:0;background:#09121aee;display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
.panel{background:#1b2c38;border:1px solid #668090;border-radius:20px;padding:25px;text-align:center;max-width:400px}
h1{font-size:29px}
button{border:0;border-radius:14px;padding:16px;background:#e8b849;color:#171717;font-weight:bold;font-size:17px;touch-action:manipulation}
#fire{position:fixed;bottom:28px;right:22px;width:92px;height:92px;border-radius:50%;background:#d94343;color:white;border:3px solid #ffbcbc}
#stick{position:fixed;bottom:25px;left:20px;width:115px;height:115px;border:2px solid #ffffff66;background:#ffffff18;border-radius:50%}
#knob{position:absolute;left:33px;top:33px;width:45px;height:45px;border-radius:50%;background:#e8b849}
#speech{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:#ff4545;text-shadow:2px 3px black;text-align:center;width:95%;display:none;z-index:4}
#flash{position:fixed;inset:0;background:#ff000055;pointer-events:none;display:none;z-index:3}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="stat">❤️ CAN: <span id="hp">100</span></div>
 <div class="stat">🎯 SKOR: <span id="score">0</span></div>
 <div class="stat">🌊 DALGA: <span id="wave">1</span></div>
</div>
<div id="flash"></div><div id="speech"></div>
<div id="stick"><div id="knob"></div></div>
<button id="fire">ATEŞ ET</button>
<div id="startScreen"><div class="panel">
<h1>🎖️ Operasyon: Son Dalga</h1>
<p>Üssü savun! Sol kumandayla hareket et, sağdaki düğmeyle ateş et. Düşmanlara çarpmamaya çalış.</p>
<button id="start">GÖREVE BAŞLA</button>
</div></div>
<script>
(function(){
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,player,enemies,bullets,score,hp,wave,playing=false,held=false,joy={x:0,y:0},joyId=null,last=0,spawn=0,damageCooldown=0;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
function reset(){player={x:W/2,y:H*.68,cool:0};enemies=[];bullets=[];score=0;hp=100;wave=1;spawn=0;damageCooldown=0;updateHud()}
function updateHud(){$('hp').textContent=hp;$('score').textContent=score;$('wave').textContent=wave}
function hurt(){if(damageCooldown>0)return;hp-=15;damageCooldown=0.65;$('flash').style.display='block';setTimeout(()=>$('flash').style.display='none',100);const lines=['ANANI SİKİM LAN!','OHA AMK!','NEREDEN VURDUN LAN!','SIÇTIK AMK!'];$('speech').textContent=lines[Math.floor(Math.random()*lines.length)];$('speech').style.display='block';setTimeout(()=>$('speech').style.display='none',950);if(navigator.vibrate)navigator.vibrate(100);if(hp<=0){hp=0;playing=false;$('startScreen').style.display='flex';$('startScreen').querySelector('h1').textContent='GÖREV BİTTİ 😂';$('startScreen').querySelector('p').textContent='Skorun: '+score+' — Bir tur daha deneyelim mi?';$('start').textContent='TEKRAR OYNA'}updateHud()}
function shoot(){if(player.cool<=0){bullets.push({x:player.x,y:player.y-20});player.cool=.2}}
function tick(t){const dt=Math.min((t-last)/1000||0,.035);last=t;if(playing){player.cool-=dt;damageCooldown-=dt;
let x=joy.x,y=joy.y;if(keys.left)x--;if(keys.right)x++;if(keys.up)y--;if(keys.down)y++;let l=Math.hypot(x,y)||1;player.x=Math.max(15,Math.min(W-15,player.x+x/l*230*dt));player.y=Math.max(60,Math.min(H-25,player.y+y/l*230*dt));if(held)shoot();
spawn-=dt;if(spawn<=0){enemies.push({x:25+Math.random()*(W-50),y:-25,r:14+Math.random()*7,s:55+wave*8});spawn=Math.max(.3,1-wave*.05)}
bullets.forEach(b=>{b.y-=520*dt;enemies.forEach(e=>{if(!e.dead&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+5){e.dead=true;b.dead=true;score+=10;wave=1+Math.floor(score/100)}})});bullets=bullets.filter(b=>!b.dead&&b.y>-20);
enemies.forEach(e=>{e.y+=e.s*dt;if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+12){e.dead=true;hurt()}else if(e.y>H+20){e.dead=true;hurt()}});enemies=enemies.filter(e=>!e.dead);updateHud()}
ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b3540');g.addColorStop(1,'#101820');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#ffffff10';for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
enemies.forEach(e=>{ctx.fillStyle='#e65050';ctx.beginPath();ctx.moveTo(e.x,e.y-e.r);ctx.lineTo(e.x+e.r,e.y);ctx.lineTo(e.x,e.y+e.r);ctx.lineTo(e.x-e.r,e.y);ctx.closePath();ctx.fill()});
bullets.forEach(b=>{ctx.fillStyle='#ffd86b';ctx.fillRect(b.x-3,b.y-8,6,14)});
if(player){ctx.fillStyle='#73d6a5';ctx.beginPath();ctx.moveTo(player.x,player.y-18);ctx.lineTo(player.x+14,player.y+12);ctx.lineTo(player.x,player.y+6);ctx.lineTo(player.x-14,player.y+12);ctx.closePath();ctx.fill()}
requestAnimationFrame(tick)}
const keys={left:false,right:false,up:false,down:false};
$('start').addEventListener('click',()=>{reset();playing=true;$('startScreen').style.display='none'});
$('fire').addEventListener('pointerdown',e=>{e.preventDefault();held=true});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('fire').addEventListener(ev,()=>held=false));
function moveJoy(e){const r=$('stick').getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),m=Math.min(1,38/(d||1));joy={x:dx*m/38,y:dy*m/38};$('knob').style.transform=`translate(${joy.x*38}px,${joy.y*38}px)`}
$('stick').addEventListener('pointerdown',e=>{joyId=e.pointerId;$('stick').setPointerCapture(e.pointerId);moveJoy(e)});
$('stick').addEventListener('pointermove',e=>{if(e.pointerId===joyId)moveJoy(e)});
function stopJoy(){joyId=null;joy={x:0,y:0};$('knob').style.transform='translate(0,0)'}
$('stick').addEventListener('pointerup',stopJoy);$('stick').addEventListener('pointercancel',stopJoy);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w')keys.up=true;if(e.key==='ArrowDown'||e.key==='s')keys.down=true;if(e.key===' ')held=true});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w')keys.up=false;if(e.key==='ArrowDown'||e.key==='s')keys.down=false;if(e.key===' ')held=false});
reset();requestAnimationFrame(tick);
})();
</script>
</body>
</html>
